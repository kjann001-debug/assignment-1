<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="signup.html">Sign Up</a>
    </nav>

    <h1>Create your account</h1>

    <form>
        <fieldset>
            <label for="firstName">First name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="First">
        </fieldset>
            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Last">
        <fieldset>
            <label for="email">Email address:</label>
            <input type="email" id="email" name="email" placeholder="example@example.gmail">
        </fieldset>
            <label id="genderLabel">Gender:</label>
            <fieldset>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male">
            </fieldset>
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">
       <fieldset>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter atleast 8 characters">
        </fieldset>
        <button type="submit">Sign Up</button>
    </form>

</body>
</html>
